# Optional local PostgreSQL. These credentials are for local development only.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: musu
      POSTGRES_USER: musu
      POSTGRES_PASSWORD: musu_local_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - musu_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U musu -d musu"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  musu_postgres:
